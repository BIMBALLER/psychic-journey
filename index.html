<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Quote Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo"><img src="image (1).jpg" alt=""></div>
        <ul class="nav-links">
            <li><a href="https://psychic-journey-lovat.vercel.app/">Home</a></li>
            <li><a href="https://bimbolaportfolio.netlify.app/">Portfolio</a></li>
            <li><a href="https://github.com/BIMBALLER" target="_blank">GitHub</a></li>
            <li><a href="https://omoabizzcuisine.vercel.app/" target="_blank">OMOABIZZ</a></li>
        </ul>
    </nav>

    <!-- Theme Toggle Button -->
    <button id="themeToggle">🌙</button>

    <!-- Main Content -->
    <div class="container">
        <div class="quote-box">
            <p id="quote">Click the button to get a quote</p>
            <p id="author"></p>
        </div>
        <button id="quote-button">Get New Quote</button>
        <button id="save-button">Save Quote</button>
        <button id="show-saved-button">Show Saved Quotes</button>
        <div class="quote-box" id="saved-quotes"></div>
    </div>

    <!-- Share Buttons -->
    <div id="share-buttons">
        <button id="share-twitter">Twitter</button>
        <button id="share-facebook">Facebook</button>
        <button id="share-whatsapp">WhatsApp</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
