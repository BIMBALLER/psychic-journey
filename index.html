<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Quote Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="quote-box">
            <p id="quote">Click the button to get a quote</p>
            <p id="author"></p>
        </div>
        <button id="quote-button">Get New Quote</button>
        <button id="save-button">Save Quote</button>
        <button id="show-saved-button">Show Saved Quotes</button>
        <div class="quote-box" id="saved-quotes"></div>
        </div>
    <script src="script.js"></script>
</body>
</html>
